$kind: http-request
url: "{{baseUrl}}/diagnostics/send/:id"
method: POST
headers:
  x-mock-response-code: "204"
pathVariables:
  id: "{{diagnosticRunID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: ""
    language: text/javascript
order: 3000
