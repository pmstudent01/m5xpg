$kind: http-request
url: "{{baseUrl}}/diagnostics/:id"
method: GET
pathVariables:
  id: "{{diagnosticRunID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: ""
    language: text/javascript
order: 2000
