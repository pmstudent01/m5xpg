$kind: http-request
url: "{{baseUrl}}/diagnostics/generate/:vehicleId"
method: POST
headers:
  x-mock-response-code: "201"
pathVariables:
  vehicleId: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: pm.collectionVariables.set("diagnosticRunID", pm.response.json().id);
    language: text/javascript
order: 1000
